app = 'homevisit-app'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_ENV = 'production'
  APP_NAME = 'KATEIHOUMON'
  APP_KEY = 'base64:6xLIc2FZrNu9wIEv4IFpDrdnloWCzgPO2fpplk6qnao='
  APP_DEBUG = 'true'
  APP_URL = 'http://localhost'
  APP_LOCALE = 'en'
  APP_FALLBACK_LOCALE = 'en'
  APP_FAKER_LOCALE = 'en_US'
  APP_MAINTENANCE_DRIVER = 'file'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  DB_CONNECTION = 'pgsql'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_LIFETIME = '120'
  SESSION_ENCRYPT = 'false'
  SESSION_PATH = '/'
  SESSION_DOMAIN = 'null'
  GEMINI_API_KEY = 'AIzaSyDeAXxd-p9WyeXd9Bvff1V8qaOp0mKohdc'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
